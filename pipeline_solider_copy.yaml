# --- Query / translation ------------------------------------------------------
#
# 자연어 검색 query 전처리 설정의 SSOT.
#
# translation.enabled
#   true  -> 한국어 query 를 영어로 번역한 뒤 text encoder 에 전달
#   false -> 원문을 그대로 전달
#
#   IRRA / SigLIP2 는 CLIP 계열 영어 토크나이저를 쓰므로 한국어 원문은
#   사실상 무의미한 토큰이 된다. 한국어 질의를 쓰려면 enabled: true 가 필요.
#
# backend
#   opus | nllb | none
#
#   opus : Helsinki-NLP/opus-mt-ko-en (약 300MB). 현재 baseline.
#   nllb : facebook/nllb-200-* (약 2.5GB). 품질은 더 나을 수 있으나 무겁다.
#   none : 번역하지 않음. 영어로만 질의할 때 사용.
#
#   OPUS 가 최고 성능으로 검증됐다는 뜻은 아니다. 기존 baseline 재현용 설정이며
#   OPUS / NLLB / SigLIP2 direct Korean 비교는 별도 retrieval A/B 로 판단한다.
#
# model_id
#   실제 번역 checkpoint. backend: none 에서는 반드시 null.
#
# max_new_tokens / cache_size
#   QueryTranslator 생성자에 그대로 연결된다.
#
# expand
#   짧은 query 를 scope-aware template 로 감싸는 선택 기능.
#   query 의미를 바꿀 수 있는 실험 변수이므로 baseline 은 false.
#
query:
  translation:
    enabled: true
    backend: opus
    model_id: Helsinki-NLP/opus-mt-ko-en
    max_new_tokens: 64
    cache_size: 2048

  expand: false
